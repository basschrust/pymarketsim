# market structure configuration file

# generic simulation parameters
num_assets: 1
sim_time: 50
lam: 0.8

markets:
  first_market:
    name: "Any name"
    agent_groups:
      zi_agents_informed:
        number: 0
      noise_agents:
        agent_class: NoiseAgent
        number: 30
        config:
          lam: 0.8
          q_max: 100
      mmzoh:
        agent_class: MMZOHAgent
        number: 1
        config:
          xi: 0.2
          K: 5
          omega: 0.2
          rebalance_period: 10

