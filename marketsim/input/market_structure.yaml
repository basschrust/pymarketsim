# market structure configuration file

# generic simulation parameters
#num_assets: 2 # used, no, not used, but has to be also specified for each agent
sim_time: 250
lob_plot_interval: 25

markets:
  security_1:
    name: "WashTraders pulling down 60-150"
    ticker: "AAA"
    market_type: continuous
    lam: 0.8 # does this have any effect? It's defined in each agent though
    agent_groups:
      zi_agents_informed:
        number: 0
      zi_agents_not_informed:
        agent_class: ZIAgentNotInformed
        number: 20
        config:
          lam: 0.2
          q_max: 80
          shade:
            - 0.1
            - 0.3
          pv_var: 5.0e2
      mmzoh_1:
        agent_class: MMZOHAgent
        number: 1
        config:
          xi: 0.2
          K: 15
          omega: 0.2
          rebalance_period: 20
      mmzoh_2:
        agent_class: MMZOHAgent
        number: 0
        config:
          xi: 0.21
          K: 10
          omega: 0.15
          rebalance_period: 28
      hbl:
        agent_class: HBLAgent
        number: 1
        config:
          q_max: 20
          L: 3 # memory length
          shade:
            - 0.1
            - 0.3
          arrival_rate: 2
          pv_var: 3.0e2
      hbl2:
        agent_class: HBLAgent
        number: 0
        config:
          q_max: 10
          L: 5 # memory length
          shade:
            - 0.05
            - 0.1
          arrival_rate: 4
          pv_var: 7.0e2
      # manipulators:
      poolA:
        agent_class: WashTradingAgent
        number: 1
        config:
          lam: 0.1 # activation factor outside manipulation periods - should behave like ZI
          q_max: 300
          manipulation_boundaries:
            manipulation_type: PUSH_DOWN #PULL_UP
            manipulation_side: BUY
            manipulation_period:
              start: 60
              end: 150
            lam: 0.5
            spread: 1.3
      poolB:
        agent_class: WashTradingAgent
        number: 1
        config:
          lam: 0.1 # activation factor outside manipulation periods - should behave like ZI
          q_max: 300
          manipulation_boundaries:
            manipulation_type: PUSH_DOWN #PULL_UP
            manipulation_side: SELL
            manipulation_period: # could be more than 1 period
              start: 60
              end: 150
            lam: 0.5
            spread: 1.3
      spoofers:
        agent_class: SpoofingAgent
        number: 0
        config:
          q_max: 10
          pv_var: 0.01
          order_size: 3
          spoofing_size: 100
          normalizers:
            fundamental: 1.0


      # momentum traders:
      momentum_1:
        agent_class: MomentumAgent
        number: 1
        config:
          lam: 0.6 # activation factor outside manipulation periods - should behave like ZI
          q_max: 30 # yet this is used as transaction volume instead of max engagement
          period: 5
      momentum_2:
        agent_class: MomentumAgent
        number: 1
        config:
          lam: 0.6 # activation factor outside manipulation periods - should behave like ZI
          q_max: 30
          period: 10
          threshold: 0.005
      momentum_3:
        agent_class: MomentumAgent
        number: 1
        config:
          lam: 0.6 # activation factor outside manipulation periods - should behave like ZI
          q_max: 30
          period: 15

  security_2: # the same market but without WashTRaders:
