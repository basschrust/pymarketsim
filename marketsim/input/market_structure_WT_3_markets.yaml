# market structure configuration file

# generic simulation parameters
sim_time: 3000
lob_plot_interval: 25
debug_logging: False

# definitions of the securities
markets:
  security_1: !include templates/markets/wt_pull_up_1000_1500.yaml

  ########################## second security ###################################################

  security_2: # the same market but without WashTRaders:
    name: "No washtraders security"
    ticker: "ABB"
    market_type: continuous
    lam: 0.8 # does this have any effect? It's defined in each agent though
    agent_groups:
      noise: !include templates/agents/noise_15_agents_rather_lazy.yaml
      mmzoh_1: !include templates/agents/MM_rebalance_20_vol_60.yaml

###################### third security #######################################

  # and the same market pushing the price down:
  security_3:
    name: "WashTraders pushing down 1000-1500"
    ticker: "ACC"
    market_type: continuous
    lam: 0.8 # does this have any effect? It's defined in each agent though
    agent_groups:
      noise: !include templates/agents/noise_15_agents_rather_lazy.yaml
      mmzoh_1: !include templates/agents/MM_rebalance_20_vol_60.yaml

      # manipulators:
      poolA:
        agent_class: WashTradingAgent
        number: 1
        config:
          lam: 0.3 # activation factor outside manipulation periods - should behave like ZI
          q_max: 3000
          manipulation_boundaries:
            manipulation_type: PUSH_DOWN #PULL_UP
            manipulation_side: BUY
            manipulation_period:
              start: 1000
              end: 1500
            lam: 0.99
            spread: 0.01  # it affects rebalance (strongly!)
      poolB:
        agent_class: WashTradingAgent
        number: 1
        config:
          lam: 0.3 # activation factor outside manipulation periods - should behave like ZI
          q_max: 3000
          manipulation_boundaries:
            manipulation_type: PUSH_DOWN #PULL_UP
            manipulation_side: SELL
            manipulation_period: # could be more than 1 period
              start: 1000
              end: 1500
            lam: 0.99
            spread: 0.01 # 0.1 seems like too small one, 0.4 seems to work fine but beware the other side!
